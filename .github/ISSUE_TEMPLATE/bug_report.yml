name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste API keys, passwords or tokens here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      placeholder: |
        1. Add the label "IoT Open" to …
        2. …
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      description: Shown in HACS, or in custom_components/iotopen/manifest.json
      placeholder: "0.3.2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: From Settings → System → Logs, filtered on "iotopen". Debug logging helps (see README).
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach the file from Settings → Devices & services → IoT Open → ⋮ → Download diagnostics.
